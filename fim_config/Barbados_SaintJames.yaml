# FIM site: Barbados, Saint James (BB04). Pluvial only, per ADM1 unit.
# Generated by fim_dev/build_admin_stores.py from the barbados island model.
# Store depths come from dmax (uint8 centimeters, saturated at 2.55 m).
# In orchestrated runs the fim_regions block in Caribbean_Comoros_config.py
# switches the whole country and overrides the thresholds below.
region: Barbados_SaintJames

outputs_root: outputs
cycle_format: "%Y%m%d.%H%M%S"

aoc_geojson: fim_config/aoc/Barbados_BB04_SaintJames_aoc.geojson
store: fim_store/Barbados/fim_store_BB04_SaintJames_v1.zarr
products_root: outputs/Barbados/fim_BB04_SaintJames

member:
  template: "tmp_output_crest_scampr_{qpf}"

trigger:
  threshold: 1.0
  sources:
    - template: "tmp_output_crest_scampr_{qpf}"

hazards:
  pluvial:
    enabled: true
    grid: qpe_accum
    band: [0.9, 1.2]
    band_wide: [0.8, 1.3]
  fluvial:
    enabled: false

thresholds_m: [0.10, 0.30, 0.70, 1.00]

overbank:
  enabled: true
  reference_scenario: sample_0002

sampling:
  expand_steps_km: [0, 2, 5, 10, 15]
  min_valid_cells: 25

likelihood_bands:
  very_low: [0.0, 0.2]
  low: [0.2, 0.4]
  medium: [0.4, 0.6]
  high: [0.6, 1.01]
