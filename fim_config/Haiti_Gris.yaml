# FIM site: Haiti, Riviere Grise (Port-au-Prince plain). ACTIVE, pluvial and fluvial.
# ------------------------------------------------------------------------------
# STATUS: rebuilt August 2026 from the second delivery. Both indexes are real.
#   store    fim_store/Haiti/fim_store_Haiti_Gris_v1.zarr.zip (split parts)
#            ALL 200 scenarios, max depth at 1 cm precision (uint16
#            centimetres in the store), 2 m grid, EPSG 32618, 7160 x 4995
#   pluvial  REAL RainyDay storm totals, the area weighted mean of the band
#            summed scenario rain geotiff over the model footprint
#            (griss_haiti_rain_scenarios_geotiff_file.zip, 200 scenarios,
#            72 bands). Full 200 row table: fim_store/Haiti/magnitudes_Gris.csv
#   fluvial  REAL per scenario boundary discharge, the maximum of the CREST
#            series delivered in HAITI_outputs_Q_GRISS.zip (one gauge,
#            cuenca_griss, 0 to 7133 m3/s across the 200 scenarios)
#
# COVERAGE, PLEASE READ: the flood map delivery (Gris.zip) contains 50 of
# the nominal 200 samples, 0001 to 0050. The store still holds ALL 200
# scenarios so the full pipeline runs now: every scenario has its REAL rain
# magnitude and REAL boundary discharge, and the 150 scenarios whose maps
# were not delivered carry a COPY of sample_0004's map (a real delivered
# Gris flood, 2.63 m max depth) as a stand in. Those scenarios are listed
# in the store's placeholder_scenarios attribute and marked
# placeholder_copy_of_sample_0004 in its index.csv, so it is always
# visible which maps are real. PRODUCTS MATCHED TO A PLACEHOLDER SCENARIO
# SHOW sample_0004's FLOODING, NOT THE SCENARIO'S OWN. When the remaining
# 150 maps arrive, rerun fim_dev/build_haiti_stores.py and nothing else
# has to change.
#
# Four of the 50 delivered maps (samples 0003, 0010, 0027, 0028) are byte
# identical and fully dry. sample_0010 is the overbank reference below.
#
# The Haiti basin list must write the gauge series with outputts=true so the
# runtime member folders contain ts.cuenca_griss.crest.<cycle>.csv.
region: Haiti_Gris

outputs_root: outputs
cycle_format: "%Y%m%d.%H%M%S"

aoc_geojson: fim_config/aoc/Haiti_Gris_aoc.geojson
store: fim_store/Haiti/fim_store_Haiti_Gris_v1.zarr
products_root: outputs/Haiti/fim_Gris

member:
  template: "tmp_output_crest_scampr_{qpf}"

trigger:
  threshold: 1.0
  sources:
    - template: "tmp_output_crest_scampr_{qpf}"
    - template: "tmp_output_crest_imerg"

hazards:
  pluvial:
    enabled: true
    grid: qpe_accum
    band: [0.9, 1.2]
    band_wide: [0.8, 1.3]
  fluvial:
    enabled: true
    stat: max
    method: standardized
    boundary_series:
      - "ts.cuenca_griss.crest.{cycle}.csv"

# USER INPUT: depth thresholds in meters.
# NOTE: in orchestrated runs the fim_regions block in
# Caribbean_Comoros_config.py OVERRIDES this thresholds list.
thresholds_m: [0.10, 0.30, 0.70, 1.00]

overbank:
  enabled: true
  # lowest rain magnitude of the library (0.02 mm) and a fully dry map, so it
  # is exactly the baseline standing water reference the overbank mask wants
  reference_scenario: sample_0010

sampling:
  expand_steps_km: [0, 2, 5, 10, 15]
  min_valid_cells: 50

likelihood_bands:
  very_low: [0.0, 0.2]
  low: [0.2, 0.4]
  medium: [0.4, 0.6]
  high: [0.6, 1.01]
