# FIM site: Comoros, Adda (KM121), Anjouan (Ndzouani). Pluvial only, per municipality.
# Generated by fim_dev/build_comoros_stores.py from the anjouan island model.
# Depths come from the model maximum depth rasters (float64 metres, stored at
# 1 cm precision). Magnitudes are REAL RainyDay storm totals: the area
# weighted mean of the band summed Comoros_SE_No3 scenario rain over this
# municipality. In orchestrated runs the fim_regions block in
# Caribbean_Comoros_config.py switches the whole country and overrides the
# thresholds below.
region: Comoros_Adda

outputs_root: outputs
cycle_format: "%Y%m%d.%H%M%S"

aoc_geojson: fim_config/aoc/Comoros_KM121_Adda_aoc.geojson
store: fim_store/Comoros/fim_store_KM121_Adda_v1.zarr
products_root: outputs/Comoros/fim_KM121_Adda

member:
  template: "tmp_output_crest_scampr_{qpf}"

trigger:
  threshold: 1.0
  sources:
    - template: "tmp_output_crest_scampr_{qpf}"

hazards:
  pluvial:
    enabled: true
    grid: qpe_accum
    band: [0.9, 1.2]
    band_wide: [0.8, 1.3]
  fluvial:
    enabled: false

thresholds_m: [0.10, 0.30, 0.70, 1.00]

overbank:
  enabled: true
  reference_scenario: sample_0056

sampling:
  expand_steps_km: [0, 2, 5, 10, 15]
  min_valid_cells: 25

likelihood_bands:
  very_low: [0.0, 0.2]
  low: [0.2, 0.4]
  medium: [0.4, 0.6]
  high: [0.6, 1.01]
